<!doctype html><meta charset="utf-8"><title>Fotoğraf araması dar ekran kontrolü</title><style>body{font:16px sans-serif;background:#ddd}section{display:inline-block;vertical-align:top;margin:8px}iframe{height:740px;border:0}output{display:block;width:320px;overflow-wrap:anywhere}</style><h1>Fotoğraf araması kontrolü</h1><script>
for(const width of [320,390]){const box=document.createElement('section'),out=document.createElement('output'),frame=document.createElement('iframe');frame.width=width;frame.setAttribute('aria-hidden','true');frame.src='/fotograf-arsivi/?q=bulunmayan-kayit&qa=20261019d#photo-search';frame.onload=()=>{const d=frame.contentDocument,links=[...d.querySelectorAll('#photo-sections a')];out.textContent=JSON.stringify({width,client:d.documentElement.clientWidth,content:d.documentElement.scrollWidth,empty:!d.getElementById('photo-empty').hidden,minLinkHeight:Math.min(...links.map(a=>a.getBoundingClientRect().height)),inputHeight:d.querySelector('#photo-search input').getBoundingClientRect().height,resetHeight:d.querySelector('#photo-empty button').getBoundingClientRect().height});};box.append(out,frame);document.body.append(box);}
</script>
