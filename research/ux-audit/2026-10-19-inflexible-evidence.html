<!doctype html><html lang="tr"><meta charset="utf-8"><title>Belge kanıtı dar ekran kontrolü</title><style>iframe{height:780px;border:1px solid #999}pre{white-space:pre-wrap}</style><h1>Belge kanıtı dar ekran kontrolü</h1><div id="frames"></div><pre id="result">Kontrol sürüyor</pre><script>
const results=[];for(const width of [320,390]){const frame=document.createElement('iframe');frame.style.width=width+'px';frame.setAttribute('aria-hidden','true');frame.src='/?mevki=inflexible#harita';document.querySelector('#frames').append(frame);frame.onload=()=>{const timer=setInterval(()=>{const d=frame.contentDocument;const marker=d.querySelector('[title="HMS Inflexible — yaklaşık hasar gösterimi"]');if(!marker)return;marker.click();const summary=d.querySelector('.panel-evidence summary');if(!summary)return;clearInterval(timer);summary.parentElement.open=true;setTimeout(()=>{const details=d.querySelector('.panel-evidence');details.scrollIntoView({block:"center"});results.push({width,open:details.open,pageOverflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,panelOverflow:details.scrollWidth>details.clientWidth,summaryHeight:details.querySelector("summary").getBoundingClientRect().height,links:[...details.querySelectorAll('a')].map(a=>({text:a.textContent,height:a.getBoundingClientRect().height}))});document.querySelector('#result').textContent=JSON.stringify(results,null,2);},1350);},200);};}
</script></html>
