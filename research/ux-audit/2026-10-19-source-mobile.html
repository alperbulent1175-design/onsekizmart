<!doctype html><meta charset="utf-8"><title>Kaynak gezinmesi dar ekran kontrolü</title><style>body{font:16px sans-serif;background:#ddd}section{display:inline-block;vertical-align:top;margin:8px}iframe{height:640px;border:0}output{display:block;width:320px;overflow-wrap:anywhere}</style><h1>Kaynak gezinmesi kontrolü</h1><script>
const pages=[['18-mart-deniz-muharebesi','kaynak-konulari'],['ariburnu-genel-taarruzu','taarruz-belgeleri'],['ariburnu-gomme-ateskesi','ateskes-belgeleri']];
for(const [slug,id] of pages){const box=document.createElement('section'),out=document.createElement('output'),frame=document.createElement('iframe');frame.width=320;frame.setAttribute('aria-hidden','true');frame.src='/olaylar/'+slug+'/?qa=20261019-final#'+id;frame.onload=()=>{const d=frame.contentDocument,nav=d.getElementById(id);nav.querySelector('details').open=true;nav.scrollIntoView();const links=[...nav.querySelectorAll('a')];out.textContent=JSON.stringify({page:slug,client:d.documentElement.clientWidth,content:d.documentElement.scrollWidth,links:links.length,minHeight:Math.min(...links.map(a=>a.getBoundingClientRect().height)),missing:links.filter(a=>!d.getElementById(a.hash.slice(1))).length});};box.append(out,frame);document.body.append(box);}
</script>
