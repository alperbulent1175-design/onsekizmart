<!doctype html><meta charset="utf-8"><title>Harita panel akışı kontrolü</title><style>body{font:16px sans-serif;background:#ddd}section{display:inline-block;vertical-align:top;margin:8px}iframe{height:740px;border:0}output{display:block;width:320px;overflow-wrap:anywhere}</style><h1>Harita panel akışı</h1><script>
for(const width of [320,390]){const box=document.createElement('section'),out=document.createElement('output'),frame=document.createElement('iframe');frame.width=width;frame.setAttribute('aria-hidden','true');frame.src='/?qa=map-flow-20261019#harita';frame.onload=()=>{try{const d=frame.contentDocument,choice=d.querySelector('#event-list button'),panel=d.getElementById('panel'),play=d.getElementById('tl-play'),close=d.getElementById('panel-close');choice.click();const opened=panel.classList.contains('open');play.click();const playing=play.getAttribute('aria-pressed');close.focus();close.click();out.textContent=JSON.stringify({width,client:d.documentElement.clientWidth,content:d.documentElement.scrollWidth,opened,playing,closed:!panel.classList.contains('open'),inert:panel.inert,stopped:play.getAttribute('aria-pressed'),stripHidden:d.getElementById('map-playback').hidden,focus:d.activeElement.id||d.activeElement.tagName});}catch(error){out.textContent=error.message;}};box.append(out,frame);document.body.append(box);}
</script>
