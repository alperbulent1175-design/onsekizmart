<!doctype html><html lang="tr"><meta charset="utf-8"><title>Anlatı dizinine dönüş kontrolü</title><style>body{font:16px sans-serif}iframe{width:320px;height:700px}pre{white-space:pre-wrap}</style><h1>Anlatı dizinine dönüş</h1><div id="frames"></div><pre id="result">Kontrol sürüyor</pre><script>
const results=[];for(const slug of ['ariburnu-genel-taarruzu','ariburnu-gomme-ateskesi']){const frame=document.createElement('iframe');frame.setAttribute('aria-hidden','true');frame.src='/olaylar/'+slug+'/';document.querySelector('#frames').append(frame);frame.onload=()=>{const d=frame.contentDocument;const links=[...d.querySelectorAll('a[href="#anlati-bolumleri"]')];links.at(-1).click();setTimeout(()=>{const nav=d.querySelector('#anlati-bolumleri');results.push({slug,returnLinks:links.length,missingTargets:links.filter(a=>!d.querySelector(a.hash)).length,minLinkHeight:Math.min(...links.map(a=>a.getBoundingClientRect().height)),overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,indexTop:nav.getBoundingClientRect().top});document.querySelector('#result').textContent=JSON.stringify(results,null,2);},300);};}
</script></html>
