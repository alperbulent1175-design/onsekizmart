<!doctype html><html lang="tr"><meta charset="utf-8"><title>Fotoğraf künyesi dokunma alanları</title><style>iframe{height:740px}pre{white-space:pre-wrap}</style><h1>Fotoğraf künyesi kontrolü</h1><div id="frames"></div><pre id="result">Kontrol sürüyor</pre><script>
const results=[];for(const width of [320,390]){const f=document.createElement('iframe');f.style.width=width+'px';f.setAttribute('aria-hidden','true');f.src='/olaylar/ariburnu-gomme-ateskesi/#foto-A05615';document.querySelector('#frames').append(f);f.onload=()=>{const d=f.contentDocument;const timer=setInterval(()=>{const v=d.querySelector('.photo-viewer');if(!v||!v.open||v.querySelector('img').hidden)return;clearInterval(timer);const c=v.querySelector('figcaption');const targets=[...v.querySelectorAll('a,button,summary')].filter(el=>el.getBoundingClientRect().height>0);results.push({width,overflow:v.scrollWidth>v.clientWidth,captionFont:f.contentWindow.getComputedStyle(c).fontSize,minTargetHeight:Math.min(...targets.map(el=>el.getBoundingClientRect().height)),targetCount:targets.length});v.scrollTop=v.scrollHeight;document.querySelector('#result').textContent=JSON.stringify(results,null,2);},150);};}
</script></html>
