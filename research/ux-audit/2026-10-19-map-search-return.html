<!doctype html><meta charset="utf-8"><title>Harita araması kontrolü</title><h1>Harita araması kontrolü</h1><output id="result"></output><iframe id="preview" width="390" height="740" aria-hidden="true" src="/?qa=20261019-close#harita"></iframe><script>document.getElementById('preview').onload=function(){try{const d=this.contentDocument,q=d.getElementById('q');q.value='inflexible';q.dispatchEvent(new Event('input',{bubbles:true}));const buttons=[...d.querySelectorAll('#q-results button')],labels=buttons.map(b=>b.textContent);buttons[0].click();const selected=d.getElementById('panel-title').textContent,selectedFocus=d.activeElement.id,close=d.getElementById('panel-close');close.focus();close.click();const tool=d.getElementById('tool-search');if(tool)tool.click();q.focus();q.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true,cancelable:true}));document.getElementById('result').textContent=JSON.stringify({query:q.value,reopened:!d.getElementById('q-results').hidden,focusedResult:d.activeElement.textContent,labels,selected,selectedFocus,closed:!d.getElementById('panel').classList.contains('open'),focus:d.activeElement.id,focusVisible:d.activeElement.getClientRects().length>0,resultsHidden:d.getElementById('q-results').hidden});}catch(e){document.getElementById('result').textContent=e.message;}};</script>
