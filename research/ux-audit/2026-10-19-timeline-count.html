<!doctype html><meta charset="utf-8"><title>Kronoloji süzgeç açıklaması</title><style>iframe{height:760px}pre{white-space:pre-wrap}</style><h1>Kronoloji süzgeci</h1><div id="frames"></div><pre id="result">Kontrol sürüyor</pre><script>
const results=[];for(const width of [320,390]){const f=document.createElement('iframe');f.style.width=width+'px';f.setAttribute('aria-hidden','true');f.src='/';document.querySelector('#frames').append(f);f.onload=()=>{const d=f.contentDocument;const timer=setInterval(()=>{const b=d.querySelector('#event-e-may19 button');if(!b)return;clearInterval(timer);b.click();d.querySelector('[data-camp="kara"]').click();const kept=d.querySelector('#timeline-filter-status').textContent;d.querySelector('[data-camp="deniz"]').click();const s=d.querySelector('#timeline-filter-status');const count=d.querySelector("#camp-results");results.push({width,kept,replaced:s.textContent,count:count.textContent,visibleRows:d.querySelectorAll("#camp-list > li").length,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth});count.scrollIntoView({block:'center'});document.querySelector('#result').textContent=JSON.stringify(results,null,2);},150);};}
</script>
