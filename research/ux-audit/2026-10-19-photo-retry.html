<!doctype html><html lang="tr"><meta charset="utf-8"><title>Fotoğraf yeniden deneme kontrolü</title><style>iframe{width:320px;height:740px}pre{white-space:pre-wrap}</style><h1>Fotoğraf yeniden deneme</h1><div id="frames"></div><pre id="result">Kontrol sürüyor</pre><script>
const results=[];for(const width of [320,390]){const f=document.createElement('iframe');f.style.width=width+'px';f.setAttribute('aria-hidden','true');f.src='/olaylar/ariburnu-gomme-ateskesi/#foto-A05615';document.querySelector('#frames').append(f);f.onload=()=>{const d=f.contentDocument;let forced=false;const timer=setInterval(()=>{const dialog=d.querySelector('.photo-viewer');if(!dialog||!dialog.open)return;const img=dialog.querySelector('img');if(!forced){if(!img.complete||!img.naturalWidth)return;forced=true;img.src='/images/qa-missing-retry.jpg';return;}const retry=[...dialog.querySelectorAll('button')].find(b=>b.textContent==='Fotoğrafı yeniden yükle');if(retry.hidden)return;clearInterval(timer);const retryHeight=retry.getBoundingClientRect().height;retry.click();setTimeout(()=>{results.push({width,retryHeight,retryHidden:retry.hidden,imageVisible:!img.hidden,imageLoaded:img.complete&&img.naturalWidth>0,dialogOpen:dialog.open,focusTag:d.activeElement.tagName,overflow:dialog.scrollWidth>dialog.clientWidth});document.querySelector('#result').textContent=JSON.stringify(results,null,2);},1200);},150);};}
</script></html>
